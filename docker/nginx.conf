# 容器内 nginx：只服务前端静态文件，TLS/边缘由宿主 nginx 负责
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite 构建产物（带 hash），可长期强缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回退：/guides/xxx 等前端路由交给 React Router
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
